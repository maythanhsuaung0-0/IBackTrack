name: Check and build Backtrack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:extension
      - name: Verify checked-in extension matches source
        run: git diff --exit-code -- manifest.json background.js popup.html content-scripts/ chunks/ icon/ assets/ scripts/extension-files.json
      - uses: actions/upload-artifact@v4
        with:
          name: backtrack-chrome
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
